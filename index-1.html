<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d25">
<title>나의 마법 찾기 | 마법 아카데미</title>
<style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#c2c9ee;--line:#718cff;--glow:#8b8dff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(ellipse at 50% 15%,#243e83 0,#101a42 38%,#070b1c 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 18%,#fff,transparent),radial-gradient(1px 1px at 25% 72%,#b6c8ff,transparent),radial-gradient(2px 2px at 82% 22%,#fff,transparent),radial-gradient(1px 1px at 72% 80%,#d6c6ff,transparent),radial-gradient(1px 1px at 45% 45%,#fff,transparent);background-size:260px 230px;opacity:.65}
main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px 16px}
.panel{width:min(100%,720px);text-align:center;padding:clamp(24px,5vw,48px) clamp(18px,5vw,44px);border:1px solid #718cff99;border-radius:26px;background:linear-gradient(145deg,#101b3be8,#080e24ed);box-shadow:0 0 45px #526dff22,inset 0 0 28px #6682ff0a;position:relative}
.panel:before{content:"✦";position:absolute;top:-15px;left:50%;transform:translateX(-50%);color:#dce5ff;background:#101a3a;padding:0 12px;font-size:22px}
.eyebrow{letter-spacing:.28em;color:#9eafff;font-size:.75rem;font-weight:700}
h1{font-size:clamp(1.75rem,5vw,3rem);line-height:1.25;margin:15px 0 12px;text-shadow:0 0 24px #8b8dff55}
.subtitle{color:var(--muted);line-height:1.8;margin:0 auto;max-width:480px}
.wand-button{margin:30px auto 16px;width:clamp(145px,35vw,200px);aspect-ratio:1;border:1px solid #8ca4ff;border-radius:50%;background:radial-gradient(circle,#394fa9 0,#18265c 55%,#0c1433 75%);display:grid;place-items:center;cursor:pointer;color:white;box-shadow:0 0 0 8px #8198ff0d,0 0 35px #687fff55,inset 0 0 25px #91a5ff25;transition:transform .25s,box-shadow .25s}
.wand-button:hover{transform:scale(1.04) rotate(-3deg);box-shadow:0 0 0 10px #8198ff12,0 0 55px #687fff88}
.wand-button:active{transform:scale(.97)}
.wand{font-size:clamp(4rem,15vw,6rem);filter:drop-shadow(0 0 12px #9daaff);display:block;transform:rotate(-25deg)}
.hint{color:#d5dcff;font-size:.95rem;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.6}}
.hidden{display:none!important}
.result-icon{font-size:clamp(4rem,14vw,6.5rem);margin:12px 0 4px;filter:drop-shadow(0 0 18px var(--glow))}
.result-name{font-size:clamp(2rem,6vw,3rem);font-weight:800;margin:6px 0 10px;color:#fff;text-shadow:0 0 22px var(--glow)}
.quote{color:#d9deff;font-size:1.05rem;margin:0 0 20px}
.description{max-width:520px;margin:0 auto 22px;color:#cbd3f6;line-height:1.9}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.tag{border:1px solid #687fffa6;border-radius:999px;padding:7px 12px;color:#dbe2ff;font-size:.82rem;background:#182858}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.action{border:1px solid #a7b2ff;border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6478ff,#7d56e9);box-shadow:0 0 20px #777bff38;transition:transform .2s}
.action:hover{transform:translateY(-2px)}
.action.secondary{background:#141f43;box-shadow:none;border-color:#566ba9;color:#dce3ff}
.status{min-height:24px;color:#bfcaff;font-size:.85rem;margin-top:15px}
footer{color:#7f8bb9;font-size:.75rem;margin-top:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section class="panel" aria-live="polite">
  <div class="eyebrow">✦ THE MAGIC ACADEMY ✦</div>
  <section id="start">
    <h1>나는 어떤 마법을<br>쓰게 될까?</h1>
    <p class="subtitle">운명의 마법봉을 눌러 봐!<br>별빛이 너에게 어울리는 마법을 골라 줄 거야.</p>
    <button class="wand-button" id="draw" aria-label="랜덤 마법 뽑기"><span class="wand" aria-hidden="true">🪄</span></button>
    <div class="hint">마법봉을 클릭하세요 ✨</div>
  </section>
  <section id="result" class="hidden">
    <h1>나는 어떤 마법을 쓰게 될까?</h1>
    <div class="result-icon" id="resultIcon">🔥</div>
    <div class="result-name" id="resultName">불의 마법</div>
    <p class="quote" id="resultQuote">「타오르는 의지로 운명을 밝힌다.」</p>
    <p class="description" id="resultDescription"></p>
    <div class="tags" id="resultTags"></div>
    <div class="actions">
      <button class="action" id="share">↗ 공유하기</button>
      <button class="action secondary" id="again">⟳ 다시 뽑기</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </section>
  <footer>당신의 마법은 무엇인가요? ✦ 결과는 랜덤으로 결정됩니다.</footer>
</section>
</main>
<script>
const spells = [
 {name:"불의 마법",icon:"🔥",quote:"「타오르는 의지로 운명을 밝힌다.」",description:"강렬한 화염을 만들어 공격하거나 주변을 환하게 밝히는 마법. 뜨거운 열정과 용기를 상징해!",tags:["화염 공격","열정","폭발적인 힘"],glow:"#ff844d"},
 {name:"물의 마법",icon:"🌊",quote:"「흐르는 물처럼, 모든 길을 찾아낸다.」",description:"물을 자유롭게 움직이고 물줄기나 파도를 만들어 내는 마법. 유연함과 적응력이 강점이야.",tags:["물줄기 조종","방어","유연함"],glow:"#52c8ff"},
 {name:"얼음의 마법",icon:"❄️",quote:"「고요한 서리 속에 흔들리지 않는 힘이 있다.」",description:"주변을 얼리거나 얼음 창과 방벽을 만드는 마법. 침착한 판단으로 전투의 흐름을 바꿔.",tags:["빙결","얼음 방벽","정밀함"],glow:"#a5eaff"},
 {name:"번개의 마법",icon:"⚡",quote:"「한순간의 섬광이 전장을 가른다.」",description:"전광석화처럼 빠르게 움직이고 번개 에너지를 방출하는 마법. 속도와 순간 집중력이 핵심이야.",tags:["고속 이동","전격","순발력"],glow:"#ffe36b"},
 {name:"바람의 마법",icon:"🌪️",quote:"「어디에도 얽매이지 않고 하늘을 누빈다.」",description:"바람을 일으켜 날아오르거나 회오리와 공기 칼날을 만드는 마법. 자유로운 움직임이 장점이야.",tags:["비행","회오리","기동력"],glow:"#9bffd9"},
 {name:"치유의 마법",icon:"💚",quote:"「빛은 상처를 어루만지고 희망을 피운다.」",description:"마력을 이용해 지친 동료를 회복시키고 보호하는 마법. 팀을 든든하게 지켜 주는 소중한 능력이야.",tags:["회복","지원","보호"],glow:"#7dffb0"},
 {name:"빛의 마법",icon:"✨",quote:"「어둠이 짙을수록 별은 선명하게 빛난다.」",description:"빛의 창과 보호막을 만들고 어둠을 밝혀 주는 마법. 정화와 수호에 특히 뛰어나.",tags:["빛의 창","정화","수호"],glow:"#fff0a3"},
 {name:"그림자 마법",icon:"🌑",quote:"「보이지 않는 곳에서 새로운 길이 열린다.」",description:"그림자 속에 몸을 숨기거나 어둠을 형상화하는 마법. 은밀한 움직임과 전략적인 활용이 중요해.",tags:["은신","그림자 이동","전략"],glow:"#b9a1ff"},
 {name:"공간 마법",icon:"🌀",quote:"「거리란, 의지가 정하는 또 하나의 규칙.」",description:"짧은 순간 공간을 이동하거나 물건을 보관하고 거리를 비트는 마법. 활용법에 따라 무궁무진해.",tags:["순간 이동","공간 왜곡","응용력"],glow:"#9d8dff"},
 {name:"시간 마법",icon:"⏳",quote:"「한순간을 붙잡는 자가 흐름을 바꾼다.」",description:"아주 짧은 시간 동안 움직임을 늦추거나 빠르게 하는 희귀한 마법. 신중한 판단이 필요한 능력이야.",tags:["시간 가속","감속","희귀 마법"],glow:"#f5c6ff"},
 {name:"대지의 마법",icon:"🪨",quote:"「굳건한 땅은 어떤 폭풍에도 무너지지 않는다.」",description:"바위와 흙을 움직여 골렘이나 방벽을 만들고 지형을 바꾸는 마법. 끈기와 안정감이 강점이야.",tags:["바위 조종","방벽","강인함"],glow:"#e8bd83"},
 {name:"소환 마법",icon:"🐉",quote:"「마력의 인연이 새로운 동료를 부른다.」",description:"마력으로 계약한 정령이나 환수의 도움을 빌리는 마법. 소환수와 호흡을 맞출수록 강해져.",tags:["정령 소환","환수","협력"],glow:"#ffa9dc"}
];
let current = null;
const $ = id => document.getElementById(id);
function drawSpell(){
  let next;
  do { next = spells[Math.floor(Math.random()*spells.length)]; } while(spells.length>1 && next===current);
  current=next;
  $("start").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("resultIcon").textContent=current.icon;
  $("resultName").textContent=current.name;
  $("resultQuote").textContent=current.quote;
  $("resultDescription").textContent=current.description;
  $("resultTags").replaceChildren(...current.tags.map(t=>{const s=document.createElement("span");s.className="tag";s.textContent=t;return s;}));
  document.documentElement.style.setProperty("--glow",current.glow);
  $("status").textContent="";
}
$("draw").addEventListener("click",drawSpell);
$("again").addEventListener("click",drawSpell);
$("share").addEventListener("click",async()=>{
 const text=`나는 어떤 마법을 쓰게 될까?\n내가 뽑은 마법은 ${current.name} ${current.icon}\n${current.quote}\n\n너는 어떤 마법일까?`;
 const status=$("status");
 if(navigator.share){
   try{await navigator.share({title:"나의 마법 찾기",text});status.textContent="공유 창을 열었어! ✨";}
   catch(e){if(e.name!=="AbortError")copyText(text,status);}
 }else{copyText(text,status);}
});
async function copyText(text,status){
 try{await navigator.clipboard.writeText(text);status.textContent="결과를 복사했어! 친구에게 붙여넣어 공유해 봐 ✨";}
 catch(e){
   const area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();
   const ok=document.execCommand("copy");area.remove();
   status.textContent=ok?"결과를 복사했어! 친구에게 붙여넣어 공유해 봐 ✨":"공유가 지원되지 않아. 결과 문구를 길게 눌러 복사해 줘!";
 }
}
</script>
</body>
</html>
